exp: exp2

tram:
  repo: https://github.com/center-for-threat-informed-defense/tram.git
  commit: f29793d8d665f7f552898696e00065ef24a29a20
  multi_label_file: data/tram2-data/multi_label.json
  license_file: LICENSE.txt

attack:
  domain: enterprise-attack
  version: "15.1"
  url: https://raw.githubusercontent.com/mitre-attack/attack-stix-data/master/enterprise-attack/enterprise-attack-15.1.json

preprocess:
  collapse_subtechniques: true
  drop_header_rows: true
  min_words_unlabelled: 4
  label_vote_min_frac: 0.5
  doc_merge_min_containment: 0.2
  doc_merge_min_words: 6
  none_max_fraction: 0.5
  dedup:
    minhash_jaccard: 0.9
    minhash_num_perm: 128
    minhash_min_words: 6

split:
  train: 0.7
  val: 0.1
  test: 0.2
  tolerance: 0.05
  seed: 42

protocols: [P-ML, P-K]
